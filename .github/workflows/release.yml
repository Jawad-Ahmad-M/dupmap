name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libncurses-dev
      - name: Build and test
        run: make test && make
      - name: Package
        run: tar -czf "dupmap-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" dupmap dupmap.1 README.md LICENSE
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dupmap-${{ github.ref_name }}-linux-x86_64.tar.gz
